<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title> Login Page </title>
    <style>
        Body {
            font-family: Calibri, Helvetica, sans-serif;
            background-color: #1DA1F2;
        }

        button {
            background-color: #1DA1F2;
            width: 100%;
            color: black;
            padding: 15px;
            margin: 10px 0px;
            border: none;
            cursor: pointer;
        }

        form {
            border: 3px solid #f1f1f1;
        }

        input[type=text], input[type=password] {
            width: 100%;
            margin: 8px 0;
            padding: 12px 20px;
            display: inline-block;
            border: 2px solid #1DA1F2;
            box-sizing: border-box;
        }

        button:hover {
            opacity: 0.7;
        }

        .cancelbtn {
            width: auto;
            padding: 10px 18px;
            margin: 10px 5px;
        }


        .container {
            padding: 25px;
            background-color: white;
        }
    </style>
</head>
<body>
    <center> <h1> Twitter Clone Login </h1> </center>
    <form id="loginForm" action="http://127.0.0.1:8080/login">
        <div class="container">
            <label>Username : </label>
            <input type="text" placeholder="Enter Username" name="username" required>
            <label>Password : </label>
            <input type="password" placeholder="Enter Password" name="password" required>
            <button type="submit">Login</button>
        </div>
    </form>
    <p id="log"></p>

    <script>
        function initWebSocket(userid) {
            websocket = new WebSocket("ws://localhost:8080/livefeed");
            //websocket.onopen = function(evt) { onOpen(evt,userid) };
            //websocket.onclose = function(evt) { onClose(evt) };
            //websocket.onmessage = function(evt) { onMessage(evt) };
            //websocket.onerror = function(evt) { onError(evt) };
        }

        async function postFormDataAsJson({ url, formData }) {
            alert("Here2");
            const plainFormData = Object.fromEntries(formData.entries());
            const formDataJsonString = JSON.stringify(plainFormData);
            // console.log(formDataJsonString);
            const fetchOptions = {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "Accept": "application/json",
                },
                body: formDataJsonString,
            };
            const response = await fetch(url, fetchOptions);
            if (!response.ok) {
                const errorMessage = await response.text();
                throw new Error(errorMessage);
            }
            alert("Here3");
	        return response.json();
        }

        async function handleLogin(event) {
            log.textContent = `Form Submitted! Time stamp: ${event.timeStamp}`;
            event.preventDefault();
            const form = event.currentTarget;
            const url = form.action;
            try {
                const formData = new FormData(form);
                const responseData = await postFormDataAsJson({ url, formData });
                var v = JSON.parse(responseData);
                if(v['code@'] !== "OK") {
                    alert("Here4");
                    console.log(v['message@']);
                    $('#loginerror').text(v['message@']);
                }else {
                    $('#loginpage').hide();
                    $('#mainpage').show();
                    user = v['userID@'];
                    $('#userlabel').text("Userid: " + user);
                    $('#logoname').text(user);
                    initWebSocket(v['userID@']);
                }           
            } catch (error) {
                console.error(error);
            }
        }

        const loginForm = document.getElementById('loginForm');
        const log = document.getElementById('log');
        loginForm.addEventListener('submit', handleLogin);
    </script>
</body>
</html>
