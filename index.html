<!DOCTYPE html>
<html>
<head>
    <script src="//code.jquery.com/jquery-1.11.1.min.js"></script>
    <title> Login Page </title>
    <link rel="stylesheet" href="https://www.w3schools.com/w3css/4/w3.css">
    <style>
        Body {
            font-family: Calibri, Helvetica, sans-serif;
            background-color: #1DA1F2;
        }

        button {
            background-color: #1DA1F2;
            width: 100%;
            color: black;
            padding: 15px;
            margin: 10px 0px;
            border: none;
            cursor: pointer;
        }

        input[type=text], input[type=password] {
            width: 100%;
            margin: 8px 0;
            padding: 12px 20px;
            display: inline-block;
            border: 2px solid #1DA1F2;
            box-sizing: border-box;
        }

        button:hover {
            opacity: 0.7;
        }

        .cancelbtn {
            width: auto;
            padding: 10px 18px;
            margin: 10px 5px;
        }

        .container {
            padding: 25px;
            background-color: white;
        }

        .topnav {
            overflow: hidden;
            background-color: #333;
        }

        .topnav a {
            float: left;
            color: #1DA1F2;
            text-align: center;
            padding: 14px 16px;
            text-decoration: none;
            font-size: 17px;
        }

        .topnav a:hover {
            background-color: #1DA1F2;
            color: black;
        }

        .topnav a.active {
            background-color: #1DA1F2;
            color: white;
        }

        /* Clear floats after the columns */
        .row:after {
            content: "";
            display: table;
            clear: both;
        }

        .card {
            background: var(--color-background);
            padding: calc(4 * var(--size-bezel));
            width: 500px;
            margin-top: calc(4 * var(--size-bezel));
        }

        .btn {
            padding:0px;
            height:33px;
            width:100px;
            text-align: center;
            color:#f1f1f1;
        }

        .logout {
            padding: 0;
            height:30px;
            width:75px;
            background-color: red;
        }
        
        h2{
            display:inline;
        }
        
    </style>

    <script>
        function show(shown, hidden) {
            document.getElementById(shown).style.display = 'block';
            document.getElementById(hidden).style.display = 'none';
            return false;
        }
    </script>
</head>
<body>
    <center> <h1> Twitter Clone </h1> </center>
    <div id="loginPage" class="container">
        <div class="topnav">
            <a class="active">Login</a>
            <a onclick="return show('registrationPage','loginPage');">Register</a>
            <a onclick="alert('You must login before visiting the Home page.');">Home</a>
            <!--<a onclick="return show('homepage','loginPage');">Home</a>-->
        </div>

        <form id="loginForm" action="http://localhost:8080/login" method="post" role="form">
            <div class="container">
                <label>Username : </label>
                <input type="text" name="username" id="username" tabindex="1" class="form-control" placeholder="Username" value="" required>
            </div>
            <div class="container">
                <label>Password : </label>
                <input type="password" name="value" id="username" tabindex="2" class="form-control" placeholder="Password" value="" required>
            </div>
            <div class="container">
                <label>Public Key : </label>
                <input type="text" name="pkey" id="username" tabindex="3" class="form-control" placeholder="pkey" value="" required>
            </div>
            <div class="container">
                <span id="loginError"></span>
            </div>
            <button type="submit" tabindex="4">Login</button>
        </form>
    </div>

    <div id="registrationPage" class="container" style="display:none">
        <div class="topnav">
            <a onclick="return show('loginPage','registrationPage');">Login</a>
            <a class="active">Register</a>
            <a onclick="alert('You must login before visiting the Home page.');">Home</a>
        </div>

        <form id="registrationForm" action="http://localhost:8080/register" method="post" role="form">
            <div class="container">
                <label>Username : </label>
                <input type="text" name="username" id="username" tabindex="1" class="form-control" placeholder="Username" value="" required>
            </div>
            <div class="container">
                <label>Password : </label>
                <input type="password" name="value" id="username" tabindex="2" class="form-control" placeholder="Password" value="" required>
            </div>
            <div class="container">
                <label>Public Key : </label>
                <input type="text" name="pkey" id="username" tabindex="3" class="form-control" placeholder="pkey" value="" required>
            </div>
            <div class="container">
                <span id="registrationError"></span>
            </div>
            <button type="submit" tabindex="4">Register</button>
        </form>
    </div>

    <div id="homePage" class="container" style="display:none">
        <div class="topnav">
            <a onclick="return show('loginPage','homePage');">Login</a>
            <a onclick="return show('registrationPage','homePage');">Register</a>
            <a class="active">Home</a>
        </div>
        
        <div><h2> Logged in as </h2><h2 id="user"></h2></div>

         <div class="row" style="display:block; width:100%;">
             <div style="width:50%; float: left; display: inline-block;" style="background-color:#aaa;">
                <h3>Tweet</h3>
                <div class="card">
                    <form id="tweetForm" class="form-horizontal" action="http://localhost:8080/tweet" method="post" role="form">
                        <label class="input">
                            <input class="form-control" placeholder="Type tweet here" type="text" name="value" required/>
                            <button class="btn" type="submit" name="tweet-button">Tweet</button>
                        </label>
                    </form>
                </div>
                
                <h3>Follow</h3>
                <div class="card">
                    <form id="followForm" class="form-horizontal" action="http://localhost:8080/follow" method="post" role="form">
                        <label class="input">
                            <input class="form-control" placeholder="Type username here" type="text" name="value" required>
                            <button class="btn" type="submit" name="follow-button">Follow</button>
                        </label>
                    </form>
                </div>
                
                <h3>Search</h3>
                <div class="card">
                    <form id="searchForm" class="form" action="http://localhost:8080/search" method="post" role="form">
                        <label class="input">
                            <input class="form-control" placeholder="Type @ or # here " type="text" name="value" required>
                            <button class="btn" type="submit" name="search-button">Search</button>
                        </label>
                    </form>
                    <div class="w3-panel w3-blue w3-card-4">
                        <ul id="searchResults" class="list-group">
                        </ul>
                    </div>
                </div>

                <button class="logout" type="submit" onClick="window.location.reload();">Logout</button>
             </div>

             <div style="width:50%; float: left; display: inline-block;" style="background-color:#bbb;">
                 <h3>Feed</h3>
                 <div class="w3-panel w3-blue w3-card-4">
                     <ul id="feedResults" class="list-group"></ul>
                 </div>
             </div>
         </div>
        
    </div>

    <script>
        function initWebSocket(username) {
            websocket = new WebSocket("ws://localhost:8080/feed");
            websocket.onopen = function(evt) { onOpen(evt, username) };
            websocket.onclose = function(evt) { onClose(evt) };
            websocket.onmessage = function(evt) { onMessage(evt) };
            websocket.onerror = function(evt) { onError(evt) };
        }

        function onOpen(evt, uid) {
            websocket.send(JSON.stringify({
                'username': uid,
                'value': ""
            }));
        }

        function printToFeed(msg, uid, ser) {
            if($("#feedResults li").length === 1 && $($(".feed"),"li:eq(0)",$("#feedResults"))[0].innerText === "No tweets in feed yet.") {
                $("#feedResults").empty();
            }
            if(ser === "Follow") {
                var something = "<li class='list-group-item'><div class='feed'>" + msg + "</div></li>";
                $("#feedResults").prepend(something);
            }
            else if(ser === "Feed") {
                //alert(msg);
                var splitmsgs = msg.split('-');
                for (var i =1; i< splitmsgs.length; i++) {
                    //alert(splitmsgs[i]);
                    var insSplit = splitmsgs[i].split('^')
                    var something = "<li class='list-group-item'><div class='feed'><span class='user'>" + insSplit[0] + "</span><br><span class='tweet'>" + insSplit[1] + "</span></div></li>";    
                    $("#feedResults").prepend(something);
                } 
            }
            else {
                var something = "<li class='list-group-item'><div class='feed'><span class='user'>" + uid + "</span><br><span class='tweet'>" + msg + "</span></div></li>"; 
                $("#feedResults").prepend(something);
            }
        }

        function onClose(evt)
        {
            websocket.close();
            window.location.reload();
        }

        function onMessage(evt)
        {
            var rep = JSON.parse(evt.data);
            //console.log(rep);
            if(rep['service'] === "Follow") {
                printToFeed(rep['message'], rep['username'], rep['service']);
            }
            else if(rep['service'] !== "Feed") {
                var spt = rep['message'].split('^');
                //console.log(spt);
                printToFeed(spt[1],spt[0], rep['service']);
            }
            else {
                printToFeed(rep['message'], rep['username'], rep['service']);
            }
        }

        function onError(evt) {
            writeToScreen('<span style="color: red;">ERROR:</span> ' + evt.data);
        }   

        async function postFormDataAsJson({ url, formData }) {
            const plainFormData = Object.fromEntries(formData.entries());
            const formDataJsonString = JSON.stringify(plainFormData);
            //alert(formDataJsonString)
            const fetchOptions = {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "Accept": "application/json",
                },
                body: formDataJsonString,
            };
            const response = await fetch(url, fetchOptions);
            if (!response.ok) {
                const errorMessage = await response.text();
                throw new Error(errorMessage);
            }
	        return response.json();
        }

        async function handleLogin(event) {
            event.preventDefault();
            const form = event.currentTarget;
            const url = form.action;
            try {
                const formData = new FormData(form);
                const responseData = await postFormDataAsJson({ url, formData });
                var v = JSON.parse(responseData);
                if(v['code@'] === "FAIL") {
                    $('#loginError').text(v['message@']);
                    $("#loginForm")[0].reset();
                } else {
                    show('homePage', 'loginPage');
                    user = v['username@'];
                    $('#user').text(user);
                    initWebSocket(v['username@']);
                }
            } catch (error) {
                console.error(error);
            }
        }

        async function handleRegistration(event) {
            event.preventDefault();
            const form = event.currentTarget;
            const url = form.action;
            try {
                const formData = new FormData(form);
                const responseData = await postFormDataAsJson({ url, formData });
                //alert(formData.username)
                var v = JSON.parse(responseData);
                if(v['code@'] === "FAIL") {
                    $('#registrationError').text(v['message@']);
                } else {
                    $("#registrationForm")[0].reset();
                    show('loginPage','registrationPage');
                    $('#loginError').text('');
                    $('#registrationError').text('');
                }           
            } catch (error) {
                console.error(error);
            }
        }

        function clearFields() {
            $("#tweetForm")[0].reset();
            $("#searchForm")[0].reset();
            $("#followForm")[0].reset();
        }

        function printToQuery(msg, uid, ser) {
            //console.log(msg);
            $("#searchResults").empty();
            var splitmsgs = msg.split('-');
            for (var i = 1; i < splitmsgs.length; i++) {
                //console.log(splitmsgs[i]);
                var insSplit = splitmsgs[i].split('^')
                if(insSplit.length > 1) {
                    var something = "<li class='list-group-item'><div class='feed'><span class='user'>" + insSplit[0] + "</span><br><span class='tweet'>" + insSplit[1] + "</span></div></li>";    
                }
                else {
                    var something = "<li class='list-group-item'><div class='feed'><span class='tweet'>" + insSplit[0] + "</span></div></li>";    
                }
                $("#searchResults").append(something);
            } 
        }

        async function handleFormSubmit(event) {
            event.preventDefault();
            const form = event.currentTarget;
            const url = form.action;
            try {
                const formData = new FormData(form);
                formData.append('username', user);
                const responseData = await postFormDataAsJson({ url, formData });
                var v = JSON.parse(responseData);
                clearFields();
                if(v['code@'] === "FAIL") {
                    alert(v['message@']);
                }
                else {
                    if(v['service@'] === "Follow") {
                        printToFeed(v['message@'], v['username@'], v['service@']);
                    }
                    else if(v['service@'] !== "Query") {
                        var temp = v['message@'].split('^');
                        printToFeed(temp[1], temp[0], v['service@']);
                    }
                    else {
                        printToQuery(v['message@'], v['username@'], v['service@']);
                    }
                }               
            } catch (error) {
                console.error(error);
            }
        }

        async function GetQueryJson({ url }) {
            const fetchOptions = {
                method: "GET",
                headers: {
                    "Content-Type": "application/json",
                    "Accept": "application/json",
                },
            };
            const response = await fetch(url, fetchOptions);
            if (!response.ok) {
                const errorMessage = await response.text();
                throw new Error(errorMessage);
            }
	        return response.json();
        }

        async function handleQuerySubmit(event) {
            event.preventDefault();
            const form = event.currentTarget;
            var url = form.action;
            try {
                const formData = new FormData(form);
                // formData.append('username',user);
                url = url + "/" + formData.get('value');
                const v = await GetQueryJson({ url });
                clearFields();
                if(v['code'] === "FAIL") {
                    window.alert(v['message']);
                }
                else {
                    printToQuery(v['message'], v['username'], v['service']);
                }               
            } catch (error) {
                console.error(error);
            }                
        }

        const loginForm = document.getElementById('loginForm');
        loginForm.addEventListener('submit', handleLogin);

        const registrationForm = document.getElementById('registrationForm');
        registrationForm.addEventListener('submit', handleRegistration);

        const followForm = document.getElementById("followForm");
        followForm.addEventListener("submit", handleFormSubmit);

        const tweetForm = document.getElementById("tweetForm");
        tweetForm.addEventListener("submit", handleFormSubmit);

        const searchForm = document.getElementById("searchForm");
        searchForm.addEventListener("submit", handleQuerySubmit);
    </script>
</body>
</html>
